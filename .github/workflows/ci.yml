name: Python validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py intelligence.py
      - run: python -m unittest discover -s tests -v
      - run: python -c "from app import app; assert app.title == 'Crypto Early Discovery AI'; print('App import OK')"
